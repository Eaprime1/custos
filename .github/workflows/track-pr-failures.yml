name: Track PR Failures

# PAUSED at owner eaprime1's request, 2026-11-13.
# Reported excessive usage requires tracing downstream automation.
# The prior tracker did not call a model directly.
# It could also close a failure issue after only one workflow succeeded.
# Automatic workflow_run handling is intentionally removed.
# Original implementation is preserved in Git history.
# Do not restore automatic tracking or delegate to an agent without review.
# Follow-up: record an incident issue, trace usage, and design bounded tracking.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Tracker paused
        run: echo 'Automatic PR failure tracking is paused pending review.'
