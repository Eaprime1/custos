# Custos — Archivist
#
# Triggers on every PR merged to main.
# If finalize-pr.yml already committed a journey doc for this PR, skips.
# Otherwise creates a momentum stub in pr-journeys/ on main directly.
#
# This is the net below the finalize gate — it catches PRs that bypass
# @claude finalize so no merged PR goes unrecorded.
#
# Stub vs. full journey:
#   - Full journey: created by finalize-pr.yml when @claude finalize is called
#   - Momentum stub: created here for everything else — lighter, marks the
#     merge event with available metadata, flags it as "stub — not finalized"
#
name: Custos — Archivist

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  archive:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archive merged PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner  = context.repo.owner;
            const repo   = context.repo.repo;
            const pr     = context.payload.pull_request;
            const prNum  = pr.number;

            const IDENTITY = '🌿 Custos — the shepherd closes the fold';
            const SYMBOL   = '∰🌿';

            // prima-clock
            const now = new Date();
            const p = n => String(n).padStart(2, '0');
            const primaClock = `${now.getUTCFullYear()}${p(now.getUTCMonth()+1)}${p(now.getUTCDate())}${p(now.getUTCHours())}${p(now.getUTCMinutes())}`;

            // prima-clock month prefix for the PR's open month (finalize-pr.yml
            // uses the month the finalize fires, which may differ from merge month)
            const prMonth = (() => {
              const d = new Date(pr.created_at);
              return `${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}`;
            })();
            const mergeMonth = primaClock.slice(0, 6);

            // Check if a journey doc already exists for this PR number in pr-journeys/
            let alreadyArchived = false;
            try {
              const { data: items } = await github.rest.repos.getContent({
                owner, repo, path: 'pr-journeys', ref: pr.base.ref,
              });
              if (Array.isArray(items)) {
                alreadyArchived = items.some(f =>
                  f.name.startsWith(`${prMonth}_PR${prNum}_`) ||
                  f.name.startsWith(`${mergeMonth}_PR${prNum}_`)
                );
              }
            } catch { /* pr-journeys/ doesn't exist yet — no prior docs */ }

            if (alreadyArchived) {
              core.info(`PR #${prNum}: journey doc already exists — archivist skips.`);
              return;
            }

            // Extract PR body sections if the template was used
            const body = pr.body || '';
            const parseSection = (label) => {
              const safe = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(`##\\s+${safe}\\s*\\n([\\s\\S]*?)(?=\\n##\\s|$)`);
              const m  = body.match(re);
              if (!m) return null;
              const txt = m[1].replace(/<!--[\s\S]*?-->/g, '').trim();
              return txt.length > 3 ? txt : null;
            };

            const intent      = parseSection('Intent');
            const whatArrived = parseSection('What Arrived');
            const resonance   = parseSection('Resonance');
            const whatDoor    = parseSection('What Door Does This Open?');

            // File count
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNum, per_page: 100,
            });
            const fc = files.length;

            // prima-clocks
            const prOpenedClock = (() => {
              const d = new Date(pr.created_at);
              return `${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}${p(d.getUTCHours())}${p(d.getUTCMinutes())}`;
            })();
            const prMergedClock = (() => {
              const d = new Date(pr.merged_at);
              return `${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}${p(d.getUTCHours())}${p(d.getUTCMinutes())}`;
            })();

            const slug = pr.title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '')
              .slice(0, 40);

            const journeyPath = `pr-journeys/${mergeMonth}_PR${prNum}_${slug}.md`;

            const stubContent = [
              `# PR Journey: #${prNum} — ${pr.title}`,
              '',
              `**Repository:** ${owner}/${repo}  `,
              `**prima-clock:** ${prMergedClock}  `,
              `**Branch:** \`${pr.head.ref}\` → \`${pr.base.ref}\`  `,
              `**Author:** @${pr.user.login}  `,
              `**State:** MERGED (momentum stub — not finalized)  `,
              '',
              '## Intent',
              '',
              intent || '*Not recorded — PR body did not use the custos template.*',
              '',
              '## What Arrived',
              '',
              whatArrived || `*${fc} file(s) changed. See PR #${prNum} for diff.*`,
              '',
              '## Resonance',
              '',
              resonance ? `*${resonance}*` : '*—*',
              '',
              '## The Arc',
              '',
              '| Event | prima-clock | Actor |',
              '|---|---|---|',
              `| Opened | ${prOpenedClock} | @${pr.user.login} |`,
              `| Merged | ${prMergedClock} | @${pr.merged_by?.login || 'unknown'} |`,
              '',
              '## Files Changed',
              '',
              `${fc} file(s) · +${pr.additions}/−${pr.deletions}`,
              '',
              ...(whatDoor ? ['## What Door Does This Open?', '', whatDoor, ''] : []),
              '---',
              `**prima-clock:** ${prMergedClock}  `,
              `**witnessed:** true  `,
              `*momentum stub — archivist · ${IDENTITY} · ${SYMBOL}*`,
            ].join('\n');

            try {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo,
                path: journeyPath,
                message: `journey: PR #${prNum} merged — momentum stub [prima-clock ${prMergedClock}]`,
                content: Buffer.from(stubContent).toString('base64'),
                branch: pr.base.ref,
              });

              core.info(`Archivist: created ${journeyPath}`);
            } catch (e) {
              core.warning(`Archivist: could not commit stub for PR #${prNum}: ${e.message}`);
            }

# ∰🏛️🌿-custos_archivist_v1
