# APIsec Scan — API Security Testing Workflow
# THE/UNEXUS / eaprime1 — Custos Branch
#
# custos has no public API surface yet. This workflow is manual/scheduled
# only — it never runs on push or pull_request — so it can't block PRs
# before there's anything to scan. Enable it for real once a project is
# registered with APIsec and the secrets below are set.
#
# BOUNDARY NOTE: This action transmits scan results to APIsec external
# servers. Appropriate for public API surfaces. Review APIsec terms before
# use on internal or proprietary endpoints.
#
# Required secrets (set in repo Settings > Secrets > Actions) once a
# project exists in APIsec:
#   APISEC_USERNAME — APIsec account username
#   APISEC_PASSWORD — APIsec account password
#   APISEC_PROJECT  — name of the project registered in APIsec
#
# The previous reference to apisec-inc/ethicalcheck-action was retired
# upstream; the active action is now apisec-inc/apisec-run-scan, which
# uses a different input scheme (account credentials + project name
# instead of an OAS URL + email).

name: EthicalCheck-API-Security

on:
  schedule:
    - cron: '22 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-security-scan:
    name: APIsec API Security Scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required secrets are configured
        id: secrets-check
        run: |
          if [ -z "${{ secrets.APISEC_USERNAME }}" ] || [ -z "${{ secrets.APISEC_PASSWORD }}" ] || [ -z "${{ secrets.APISEC_PROJECT }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scan: APISEC_USERNAME, APISEC_PASSWORD, and/or APISEC_PROJECT secrets are not set."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run APIsec API Security Scan
        id: apisec
        if: steps.secrets-check.outputs.configured == 'true'
        uses: apisec-inc/apisec-run-scan@8f66ce948afb779712a1d57ecb0a528d7ded5a45 # v1.0.7
        with:
          apisec-username: ${{ secrets.APISEC_USERNAME }}
          apisec-password: ${{ secrets.APISEC_PASSWORD }}
          apisec-project: ${{ secrets.APISEC_PROJECT }}
          sarif-result-file: "apisec-results.sarif"

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: steps.secrets-check.outputs.configured == 'true' && always()
        with:
          sarif_file: ./apisec-results.sarif
          category: apisec-api-security
