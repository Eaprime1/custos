# EthicalCheck — API Security Testing Workflow
# THE/UNEXUS / eaprime1 — Custos Branch
# Prima-clock: 202606150227
# Suit: ♣️ Club (active working copy)
# Plank: 1/3 — starter template, configure before promoting
#
# BOUNDARY NOTE: This action transmits your OAS spec to APIsec external servers.
# Appropriate for public API surfaces. Review APIsec terms before use on
# internal or proprietary endpoints.
#
# Third-party action pinned to commit SHA per GitHub security best practices.

name: EthicalCheck-API-Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 18 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-security-scan:
    name: EthicalCheck API Security Scan
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run EthicalCheck API Security Scan
        id: ethicalcheck
        uses: apisec-inc/ethicalcheck-action@005fac321dd843682b1af6b72f30caaf9952c641
        with:
          # TODO: Replace with your actual OpenAPI/Swagger spec URL
          # Options: OpenAPI URL, Swagger path, or public Postman collection URL
          oas-url: ${{ secrets.API_SPEC_URL }}

          # TODO: Replace with your actual notification email
          # Store in GitHub Secrets, not plaintext
          email: ${{ secrets.ETHICALCHECK_EMAIL }}

          sarif-result-file: "ethicalcheck-results.sarif"

      - name: Verify SARIF output exists
        run: |
          if [ ! -f "./ethicalcheck-results.sarif" ]; then
            echo "WARNING: SARIF file not generated. Scan may have failed or found no endpoints."
            echo "Check EthicalCheck output above for details."
            # Not failing hard here — allows workflow to complete and report
          else
            echo "SARIF file confirmed. Proceeding to upload."
          fi

      - name: Upload SARIF results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ./ethicalcheck-results.sarif
          category: ethicalcheck-api-security
