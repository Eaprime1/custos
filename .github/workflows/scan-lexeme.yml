name: Scan Lexeme

on:
  pull_request:
    branches: [main, radix]

# Read-only: this check reads the checkout and writes nothing back.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Scan for distressed lexemes
        run: bash tools/scan_lexeme.sh
        # Advisory — outputs findings but does not block merge.
        # Distressed lexemes are invitations, not failures.
