# Custos — Sovran Labels Sync
#
# Creates or updates the Sovran label schema on this repo.
# Trigger options:
#   - Comment `@claude sync-labels` on any issue or PR
#   - Push that touches .github/sovran-labels.yml (on main only)
#   - Manual dispatch from the Actions tab
#
# Labels defined in: .github/sovran-labels.yml
# For cross-repo sync, run this workflow in each target repo
# or set up a GitHub App with write access to multiple repos.
name: Custos — Sovran Labels Sync

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - .github/sovran-labels.yml
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate — comment trigger
        id: gate
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          if echo "$COMMENT_BODY" | grep -qF '@claude sync-labels'; then
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR) echo "triggered=true" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Always trigger on push or dispatch
        id: passthrough
        if: github.event_name != 'issue_comment'
        run: echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Apply Sovran label schema
        if: steps.gate.outputs.triggered == 'true' || steps.passthrough.outputs.triggered == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo  = context.repo.repo;
            const SYMBOL = '∰🌿';

            // Label definitions — mirrors .github/sovran-labels.yml
            const LABELS = [
              { name: 'concordance',    color: '0075ca', description: 'PR has a compiled concordance report'                      },
              { name: 'icon-assigned',  color: 'e4e669', description: 'PR introduces or assigns a project icon'                    },
              { name: 'glossary-update',color: 'd93f0b', description: 'PR updates the glossary, dictionary, or lexeme registry'    },
              { name: 'bbs-active',     color: '0052cc', description: 'BBS node is active — PR is in live dialogue'                },
              { name: 'sovran',         color: '5319e7', description: 'Sovran system contribution'                                },
              { name: 'held',           color: 'b60205', description: 'Held — addressed in a separate conversation or decision'    },
              { name: 'witnessed',      color: '0e8a16', description: 'Witnessed and recorded in the prima custody chain'          },
              { name: 'closure',        color: 'bfd4f2', description: 'Stale branch closure — follows docs/stale-branch-closure.md' },
              { name: 'finalized',      color: '5319e7', description: 'Review period closed — PR Journey committed'                },
              { name: 'mission',        color: '1d76db', description: 'Structured work: clear deliverable + deterministic completion check'   },
              { name: 'sparstone-trial', color: 'fbca04', description: 'Open challenge. First to complete earns the Sparstone; all completers earn XP. No cash' },
              { name: 'payment-request', color: '000000', description: 'Submission asks for payment. custos pays no cash; not merged as-is. No links clicked' },
              { name: 'upgrade',        color: '3358ce', description: 'Sharpen or extend something that already exists'                     },
              { name: 'lexeme',         color: 'c5def5', description: 'Develop a named concept or term from a citable source (the fallback path)' },
              { name: 'open',           color: '0e8a16', description: 'Available — no claim yet'                                           },
              { name: 'claimed',        color: 'fef2c0', description: 'Someone commented a claim; work in progress'                          },
              { name: 'submitted',      color: 'bfdadc', description: 'A PR or submission is linked and waiting on the Shepherd'             },
              { name: 'needs-shepherd', color: 'e99695', description: 'Blocked on a Shepherd decision, device access, or an outside system'   },
              { name: 'bot-friendly',   color: '5319e7', description: 'Carries a Bot Brief; automated submissions welcome'                   },
              { name: 'anchor-review',  color: 'd93f0b', description: '[ANCHOR REVIEW NEEDED] — a lore or custody claim lacks an anchor (guides/anchor-review.md)' },
            ];

            const results = { created: [], updated: [], unchanged: [] };

            for (const label of LABELS) {
              try {
                const { data: existing } = await github.rest.issues.getLabel({
                  owner, repo, name: label.name,
                });
                if (existing.color !== label.color || existing.description !== label.description) {
                  await github.rest.issues.updateLabel({
                    owner, repo, name: label.name,
                    color: label.color, description: label.description,
                  });
                  results.updated.push(label.name);
                } else {
                  results.unchanged.push(label.name);
                }
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({
                    owner, repo, name: label.name,
                    color: label.color, description: label.description,
                  });
                  results.created.push(label.name);
                } else {
                  core.warning(`${label.name}: ${e.message}`);
                }
              }
            }

            const summary = [
              `Created: ${results.created.length > 0 ? results.created.join(', ') : 'none'}`,
              `Updated: ${results.updated.length > 0 ? results.updated.join(', ') : 'none'}`,
              `Unchanged: ${results.unchanged.length}`,
            ].join(' · ');

            core.info(`Sovran label sync complete — ${summary}`);

            // Post result comment if triggered by issue_comment
            if (context.eventName === 'issue_comment') {
              const body = [
                `## 🌿 Sovran Labels — Synced`,
                '',
                summary,
                '',
                '---',
                `*Custos label sync · ${SYMBOL}*`,
              ].join('\n');
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: context.issue.number,
                body,
              });
            }

# ∰🛠️🌿-custos_sovran_labels_v1
