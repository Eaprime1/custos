# Custos — Probatio Label
#
# The soft seal. When the owner comments `^<name> probatio` (or `^omnes probatio`)
# on a PR, this sets the `ready-for-oversight` label and keeps one comment that
# names the head commit. A push by a person takes the label off again, because
# the soft seal covered the earlier head. A push by a bot leaves it.
#
# It reads cues with .github/scripts/cue-parser.js: owner only, never a bot,
# never a comment with the Claude Code footer, never a cue inside quotes or code.
# `ultima probatio` is the final seal and belongs to finalize-pr.yml, so it does
# not set this label. This workflow never seals and never merges.
# See docs/latin-workflow-v2.md.
name: Custos — Probatio Label

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: probatio-label-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, 'probatio')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set or withdraw the soft seal
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const lib = require('./.github/scripts/probatio-label.js');
            const run = context.eventName === 'pull_request' ? lib.onPush : lib.onComment;
            await run({ github, context, core });
