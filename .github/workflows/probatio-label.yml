# Custos — Probatio Label
#
# A Probatio cue is a request, not proof of a soft seal or a verified packet.
# Requests never set `ready-for-oversight`; ChatGPT prepares a packet after
# checking contributor reports on the current head. A person push removes a
# previously applied label because the packet covered an earlier head.
#
# It reads cues with .github/scripts/cue-parser.js: owner only, never a bot,
# never a comment with the Claude Code footer, never a cue inside quotes or code.
# `ultima probatio` is the later final seal and belongs to finalize-pr.yml.
# This workflow never sets readiness from a request, never seals, and never merges.
# See docs/latin-workflow-v2.md.
name: Custos — Probatio Label

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: probatio-label-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  label:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       github.event.comment.author_association == 'OWNER' &&
       contains(github.event.comment.body, 'probatio')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Use trusted default-branch code for issue_comment and pull_request events.
          ref: ${{ github.event.repository.default_branch }}

      - name: Set or withdraw the soft seal
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const lib = require('./.github/scripts/probatio-label.js');
            const run = context.eventName === 'pull_request' ? lib.onPush : lib.onComment;
            await run({ github, context, core });
