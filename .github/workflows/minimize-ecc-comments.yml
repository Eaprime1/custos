name: Minimize outdated ECC Tools comments

on:
  issue_comment:
    types: [created]

jobs:
  minimize-old-ecc-comments:
    # Only run on PR comments from ecc-tools[bot]
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'ecc-tools[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Minimize outdated ECC Tools comments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const newCommentId = context.payload.comment.id;
            const newBody = context.payload.comment.body || '';
            const prNumber = context.payload.issue.number;

            // ECC Tools embeds the commit SHA in each comment's HTML marker:
            // <!-- ecc-tools:pr-audit:ECC Tools / <check>:<sha> -->
            // Extract it so we only minimize comments from OLDER commits,
            // not the other three comments ECC Tools posts for this same commit.
            const shaMatch = newBody.match(/ecc-tools:pr-audit:[^:]+:([0-9a-f]{40})/);
            const currentSha = shaMatch ? shaMatch[1] : null;

            if (!currentSha) {
              core.info('No SHA found in ECC Tools comment — skipping.');
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              }
            );

            const toMinimize = comments.filter(c => {
              if (c.id === newCommentId) return false;
              if (c.user.login !== 'ecc-tools[bot]') return false;
              const m = (c.body || '').match(/ecc-tools:pr-audit:[^:]+:([0-9a-f]{40})/);
              const sha = m ? m[1] : null;
              return sha && sha !== currentSha;
            });

            for (const comment of toMinimize) {
              try {
                await github.graphql(`
                  mutation($id: ID!) {
                    minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                      minimizedComment { isMinimized }
                    }
                  }
                `, { id: comment.node_id });
                core.info(`Minimized comment ${comment.id} (SHA: ${comment.body.match(/ecc-tools:pr-audit:[^:]+:([0-9a-f]{40})/)?.[1]})`);
              } catch (err) {
                core.warning(`Could not minimize comment ${comment.id}: ${err.message}`);
              }
            }

            core.info(`Done — minimized ${toMinimize.length} outdated ECC Tools comment(s).`);
