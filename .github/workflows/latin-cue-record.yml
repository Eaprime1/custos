# Custos — Latin Cue Record
#
# When the owner comments a Latin workflow call on a PR (docs/latin-workflow-glossary.md:
# Recensio, Probatio, Lustratio, Judicium, Novissimum, Cursus, with or without a
# modifier such as Prima, Ultima or Renovata), this gathers the PR's state into
# one comment, so the final review before merge has it in one place:
#   - a log of every cue: when, which call, who, and the head commit at the time
#   - commits pushed since the previous cue, with a compare link
#   - checks on the head commit: passed, failed, still running
#   - unresolved review threads, merge state, draft, labels, witness seal
#   - a link to the review packet (review-packet.yml)
#   - the oversight observation: whether turns/observations/<clock>_pr<N>_observation.md
#     is on the head commit, its status line, and the observed box below
#     `witnessed` in the PR description (ticked here once the document is there)
#
# It also records a Prima Recensio when a PR opens ready for review or is marked
# ready for review: the first witness (docs/latin-workflow-glossary.md). That row
# is logged by the event, with no comment needed. The paid Claude review runs on
# the same event from claude-code-review.yml; this record only snapshots the PR.
#
# It only records. It calls no model, and it doesn't review, seal or merge.
# Sealing stays with finalize-pr.yml; merging stays with the project's final
# review. Other conversations can work a PR with these calls; this record is
# what we check before the merge.
#
# A comment with the Claude Code footer is a navigo writing under the owner's
# login, so it is never recorded as a cue. Cues inside `code`, ``` blocks or
# > quotes are quoted, not given, and are ignored.
name: Custos — Latin Cue Record

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: write
  issues: write

concurrency:
  # One update at a time per PR, and never cancel one: each run adds a log row.
  group: latin-cue-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  record:
    # Cheap pre-filter (contains() ignores case); the script does the exact match.
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.fork == false &&
       github.event.sender.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       (contains(github.event.comment.body, 'recensio') ||
        contains(github.event.comment.body, 'probatio') ||
        contains(github.event.comment.body, 'lustratio') ||
        contains(github.event.comment.body, 'judicium') ||
        contains(github.event.comment.body, 'novissimum') ||
        contains(github.event.comment.body, 'cursus')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the cue and gather the PR's state
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const MARKER = '<!-- custos-latin-cue -->';
            const LOG_START = '<!-- cue-log-start -->';
            const LOG_END = '<!-- cue-log-end -->';
            const { owner, repo } = context.repo;
            const isPr = context.eventName === 'pull_request';
            const prNum = isPr ? context.payload.pull_request.number : context.issue.number;
            let cue, by, source, when;

            if (isPr) {
              // Prima Recensio: the first witness, logged by the event itself.
              const act = context.payload.action;
              cue = 'Prima Recensio';
              by = context.payload.sender.login;
              source = `[${act === 'opened' ? 'opened ready' : 'ready for review'}](${context.payload.pull_request.html_url})`;
              when = new Date();
            } else {
              const comment = context.payload.comment;
              const raw = comment.body || '';

              if (raw.includes('Generated by [Claude Code]')) {
                core.info('Comment carries the Claude Code footer; not an owner cue.');
                return;
              }

              // Drop quoted material, then find the call.
              const text = raw
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/`[^`\n]*`/g, ' ')
                .replace(/^[ \t]*>.*$/gm, ' ');
              const ACTIONS = ['Recensio', 'Probatio', 'Lustratio', 'Judicium', 'Novissimum', 'Cursus'];
              const MODS = ['Prima', 'Ultima', 'Suprema', 'Extrema', 'Renovata', 'Expeditus'];
              const words = (text.match(/[A-Za-z]+/g) || []).map(w => w.toLowerCase());
              const cap = w => w[0].toUpperCase() + w.slice(1);
              const cueWords = [];
              words.forEach((w, i) => {
                if (!ACTIONS.some(a => a.toLowerCase() === w)) return;
                const before = words[i - 1], after = words[i + 1];
                const pre = MODS.find(m => m.toLowerCase() === before);
                const post = MODS.find(m => m.toLowerCase() === after);
                cueWords.push([pre, cap(w), post].filter(Boolean).join(' '));
              });
              if (!cueWords.length) {
                core.info('No Latin call outside quotes; nothing to record.');
                return;
              }
              cue = [...new Set(cueWords)].join(' · ');
              by = comment.user.login;
              source = `[comment](${comment.html_url})`;
              when = new Date(comment.created_at);
            }

            // Prima-clock stamp, UTC (YYYYMMDDHHMM). Official records are UTC so
            // they do not depend on where the owner is; the seal and the custody
            // logs use the same clock.
            const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
              timeZone: 'UTC', year: 'numeric', month: '2-digit',
              day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
            }).formatToParts(when).map(p => [p.type, p.value]));
            const stamp = `${parts.year}${parts.month}${parts.day}${parts.hour}${parts.minute}`;

            // ── PR state ─────────────────────────────────────────────────────
            let { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNum });
            if (pr.mergeable === null) {
              // GitHub computes mergeability lazily; ask once more.
              await new Promise(r => setTimeout(r, 3000));
              ({ data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNum }));
            }
            const head = pr.head.sha;
            const short = head.slice(0, 7);

            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner, repo, ref: head, per_page: 100,
            });
            const failed = runs.filter(r => r.status === 'completed' &&
              ['failure', 'timed_out', 'cancelled', 'action_required'].includes(r.conclusion));
            const pending = runs.filter(r => r.status !== 'completed');
            const passed = runs.filter(r => r.conclusion === 'success').length;
            const skipped = runs.filter(r => ['skipped', 'neutral'].includes(r.conclusion)).length;

            const threads = [];
            let after = null;
            do {
              const q = await github.graphql(`query($o:String!,$r:String!,$n:Int!,$a:String){
                repository(owner:$o,name:$r){ pullRequest(number:$n){
                  reviewThreads(first:100,after:$a){
                    pageInfo{ hasNextPage endCursor }
                    nodes{ isResolved path comments(first:1){ nodes{ author{ login } url } } }
                  } } } }`, { o: owner, r: repo, n: prNum, a: after });
              const rt = q.repository.pullRequest.reviewThreads;
              threads.push(...rt.nodes);
              after = rt.pageInfo.hasNextPage ? rt.pageInfo.endCursor : null;
            } while (after);
            const open = threads.filter(t => !t.isResolved);

            const labels = pr.labels.map(l => l.name);
            const sealed = (pr.body || '').includes('witnesses:sealed');

            // ── Oversight observation (turns/observations/README.md) ────────
            // The observation is a document in the PR branch. When it is there
            // and the observed box in the description is unticked, tick it. This
            // reads the branch and edits the description only: no commit.
            let observation = null, obsStatus = null, boxTicked = false;
            const BOX_OFF = /^- \[ \] (\*\*observed:\*\*)/m;
            const BOX_ON = /^- \[[xX]\] \*\*observed:\*\*/m;
            try {
              const hr = pr.head.repo;
              const { data: dir } = await github.rest.repos.getContent({
                owner: hr.owner.login, repo: hr.name, path: 'turns/observations', ref: head,
              });
              const re = new RegExp(`^\\d{12}_pr${prNum}_observation\\.md$`);
              observation = (Array.isArray(dir) ? dir : [])
                .filter(x => x.type === 'file' && re.test(x.name))
                .sort((a, b) => a.name.localeCompare(b.name)).pop() || null;
              if (observation) {
                const { data: file } = await github.rest.repos.getContent({
                  owner: hr.owner.login, repo: hr.name, path: observation.path, ref: head,
                });
                const txt = Buffer.from(file.content || '', 'base64').toString('utf8');
                obsStatus = (txt.match(/^status:\s*([A-Za-z-]+)/m) || [])[1] || 'unstated';
              }
            } catch (e) {
              if (e.status !== 404) core.warning(`Observation lookup failed: ${e.status || e.message}`);
            }
            if (observation && BOX_OFF.test(pr.body || '')) {
              try {
                await github.rest.pulls.update({
                  owner, repo, pull_number: prNum, body: pr.body.replace(BOX_OFF, '- [x] $1'),
                });
                boxTicked = true;
              } catch (e) {
                core.warning(`Could not tick the observed box: ${e.status || e.message}`);
              }
            }
            const boxOn = boxTicked || BOX_ON.test(pr.body || '');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNum, per_page: 100,
            });
            const packet = comments.find(c => (c.body || '').startsWith('<!-- custos-review-packet -->'));
            const mine = comments.find(c => c.user?.type === 'Bot' && (c.body || '').startsWith(MARKER));

            // ── Cue log: keep earlier rows, add this one ─────────────────────
            let oldRows = [];
            if (mine) {
              const b = mine.body;
              const s = b.indexOf(LOG_START), e = b.indexOf(LOG_END);
              if (s !== -1 && e > s) {
                oldRows = b.slice(s + LOG_START.length, e).split('\n').filter(l => /^\| \d{12} /.test(l));
              }
            }
            const prevSha = oldRows.length
              ? (oldRows[oldRows.length - 1].match(/`([0-9a-f]{7,40})`/) || [])[1]
              : null;
            let since = 'first cue on this PR';
            if (prevSha && prevSha !== short) {
              try {
                const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                  owner, repo, basehead: `${prevSha}...${head}`,
                });
                since = `${cmp.ahead_by} commit(s) since the last cue ` +
                  `([compare](https://github.com/${owner}/${repo}/compare/${prevSha}...${short}))`;
              } catch (e) {
                since = `head moved from \`${prevSha}\` (compare unavailable: ${e.status || e.message})`;
              }
            } else if (prevSha) {
              since = 'no new commits since the last cue';
            }
            const row = `| ${stamp} | ${cue} | @${by} | \`${short}\` | ${source} |`;
            const rows = [...oldRows, row];

            // ── Verdict for the final review (a summary, not a gate) ─────────
            const clean = pr.mergeable_state === 'clean';
            const ready = !pr.draft && !failed.length && !pending.length && !open.length && clean;
            const yes = '✅', no = '⬜';
            const list = (arr, fmt, max = 10) => arr.length
              ? arr.slice(0, max).map(fmt).join('\n') + (arr.length > max ? `\n- …and ${arr.length - max} more` : '')
              : '- none';

            const bodyText = [
              MARKER,
              '### Latin cue record',
              '',
              `Latest cue: **${cue}** · prima-clock ${stamp} · head \`${short}\` · ${since}.`,
              '',
              '**State for the final review before merge**',
              `${ready ? yes : no} Ready to verify for merge ` +
                '(not a draft, checks passed, no open threads, merges cleanly)',
              `- Draft: ${pr.draft ? 'yes' : 'no'} · merge state: \`${pr.mergeable_state}\``,
              `- Checks on \`${short}\`: ${passed} passed · ${failed.length} failed · ` +
                `${pending.length} running · ${skipped} skipped`,
              failed.length ? list(failed, r => `  - ❌ [${r.name}](${r.html_url}) (${r.conclusion})`) : '',
              pending.length ? list(pending, r => `  - ⏳ ${r.name}`) : '',
              `- Unresolved review threads: ${open.length}`,
              open.length ? list(open, t => {
                const c = t.comments.nodes[0] || {};
                return `  - \`${t.path}\` by ${c.author?.login || 'a deleted user'} ([thread](${c.url}))`;
              }) : '',
              `- Witness list sealed: ${sealed ? 'yes' : 'no'} · labels: ${labels.length ? labels.map(l => `\`${l}\``).join(', ') : 'none'}`,
              `- Observation: ${observation ? `[filed](${observation.html_url}) · status \`${obsStatus}\`` : 'not filed yet'} · observed box: ${boxOn ? 'ticked' : 'not ticked'}`,
              `- Review packet: ${packet ? `[latest](${packet.html_url})` : 'not posted yet'}`,
              '',
              '**Cue log**',
              LOG_START,
              '| prima-clock | Call | By | Head | Source |',
              '|---|---|---|---|---|',
              ...rows,
              LOG_END,
              '',
              '<sub>Generated by `.github/workflows/latin-cue-record.yml`. It records only: ' +
                'no model call, no review, no seal, no merge.</sub>',
            ].filter(l => l !== '').join('\n')
              // keep blank lines around headings and the table readable
              .replace(/\n(\*\*Cue log\*\*)/, '\n\n$1')
              .replace(/\n(\*\*State for)/, '\n\n$1')
              .replace(/\n(<sub>)/, '\n\n$1');

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: bodyText });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNum, body: bodyText });
            }
            core.info(`Recorded "${cue}" at ${stamp} on ${short}.`);
