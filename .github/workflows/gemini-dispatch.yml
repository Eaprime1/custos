name: 'Gemini Dispatch'
# Routes @gemini-cli comments, PR opens, and new issues to the right workflow.

on:
  pull_request_review_comment:
    types: ['created']
  pull_request_review:
    types: ['submitted']
  pull_request:
    types: ['opened']
  issues:
    types: ['opened', 'reopened']
  issue_comment:
    types: ['created']

defaults:
  run:
    shell: 'bash'

jobs:
  dispatch:
    timeout-minutes: 2
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false
      ) || (
        github.event_name == 'issues' &&
        contains(fromJSON('["opened", "reopened"]'), github.event.action)
      ) || (
        github.event.sender.type == 'User' &&
        github.event.sender.login != 'dependabot[bot]' &&
        github.event.sender.login != 'renovate[bot]' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.review.author_association || '')
      )
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      pull-requests: 'read'
      issues: 'read'
    outputs:
      command: '${{ steps.parse.outputs.command }}'
      additional_context: '${{ steps.parse.outputs.additional_context }}'
    steps:
      - name: 'Gate — check trigger phrase'
        id: 'gate'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          COMMENT_BODY: '${{ github.event.comment.body || github.event.review.body || '' }}'
        run: |-
          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "issues" ]]; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          elif echo "$COMMENT_BODY" | grep -qF '@gemini-cli'; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Parse command'
        id: 'parse'
        if: steps.gate.outputs.triggered == 'true'
        env:
          EVENT_NAME: '${{ github.event_name }}'
          COMMENT_BODY: '${{ github.event.comment.body || github.event.review.body || '' }}'
          IS_PR: '${{ !!github.event.pull_request }}'
          IS_ISSUE: '${{ github.event_name == ''issues'' }}'
        run: |-
          COMMAND="fallthrough"
          CONTEXT=""

          if [[ "${IS_PR}" == "true" && "${EVENT_NAME}" == "pull_request" ]]; then
            COMMAND="review"
          elif [[ "${IS_ISSUE}" == "true" ]]; then
            COMMAND="triage"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli review"* ]]; then
            COMMAND="review"
            CONTEXT="${COMMENT_BODY#@gemini-cli review}"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli triage"* ]]; then
            COMMAND="triage"
            CONTEXT="${COMMENT_BODY#@gemini-cli triage}"
          elif [[ "${COMMENT_BODY}" == "@gemini-cli"* ]]; then
            RAW_CONTEXT="${COMMENT_BODY#@gemini-cli}"
            IFS=$' \t\n' read -r SUBCOMMAND _ <<< "${RAW_CONTEXT}"
            if [[ -z "${SUBCOMMAND}" || "${SUBCOMMAND}" == "invoke" ]]; then
              COMMAND="invoke"
              CONTEXT="${RAW_CONTEXT}"
            else
              echo "Unknown @gemini-cli subcommand: '${SUBCOMMAND}'. Valid: review, triage, or [prompt]" >&2
              exit 1
            fi
          fi

          if [[ ${#CONTEXT} -gt 500 ]]; then
            CONTEXT="${CONTEXT:0:500}"
          fi

          echo "command=${COMMAND}" >> "$GITHUB_OUTPUT"
          OUTPUT_DELIMITER="CUSTOS_OUTPUT_${GITHUB_RUN_ID}_${GITHUB_SHA:0:8}"
          SAFE_CONTEXT="${CONTEXT//${OUTPUT_DELIMITER}/}"
          {
            echo "additional_context<<${OUTPUT_DELIMITER}"
            echo "${SAFE_CONTEXT}"
            echo "${OUTPUT_DELIMITER}"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''review'' }}'
    uses: './.github/workflows/gemini-review.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  triage:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''triage'' }}'
    uses: './.github/workflows/gemini-triage.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

  invoke:
    needs: 'dispatch'
    if: '${{ needs.dispatch.outputs.command == ''invoke'' }}'
    uses: './.github/workflows/gemini-invoke.yml'
    permissions:
      contents: 'read'
      id-token: 'write'
      issues: 'write'
      pull-requests: 'write'
    with:
      additional_context: '${{ needs.dispatch.outputs.additional_context }}'
    secrets: 'inherit'

# ♓🛠️⊕-custos_gemini_dispatch_v1
