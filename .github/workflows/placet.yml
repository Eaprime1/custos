# Custos — Placet
#
# Mission board accept step. On issue_comment, the owner's `placet` cue on a
# `mission` issue that holds a petitio flips it from open/paused to
# in-progress and names who holds the seat. See docs/mission-board.md.
#
# Like the seal gate, it ignores comments that carry the Claude Code footer
# (a navigo writing under the owner's login is not the owner's nod), cues
# inside quotes or code, and PRs. It never sets `claimed`; that label belongs
# to the public claim path (claim-register.yml).
name: Custos — Placet

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  placet:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.author_association == 'OWNER' &&
      !contains(github.event.comment.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept the petitio
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const raw = context.payload.comment.body || '';

            // Ignore cues inside code fences, inline code or quotes.
            const strip = s => s
              .replace(/```[\s\S]*?```/g, '')
              .replace(/`[^`]*`/g, '')
              .split('\n')
              .filter(l => !/^\s*>/.test(l))
              .join('\n');
            if (!/^\s*@claude\s+placet\b/im.test(strip(raw))) {
              core.info('Not a placet cue.');
              return;
            }

            const labels = issue.labels.map(l => l.name);
            if (!labels.includes('mission')) {
              core.info('Not a mission issue; no action.');
              return;
            }
            if (issue.state === 'closed') {
              core.info('Issue is closed; no action.');
              return;
            }

            const reply = async (lines) => github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: ['## 🌿 Placet', '', ...lines, '',
                '---', '*Custos placet · ∰🌿*'].join('\n'),
            });

            if (labels.includes('in-progress')) {
              await reply(['**Already in progress.** A petitio was accepted earlier; nothing changed.']);
              return;
            }
            // `claimed` and `submitted` are set elsewhere; the board leaves them alone.
            if (labels.includes('claimed') || labels.includes('submitted')) {
              await reply(['**Not changed.** This mission carries `claimed` or `submitted`, which the board does not set or clear. Settle that first.']);
              return;
            }

            // Find the latest petitio comment (cues in code or quotes do not count).
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, per_page: 100,
            });
            const petitios = comments.filter(c =>
              c.id !== context.payload.comment.id &&
              c.user && c.user.type !== 'Bot' &&
              /^\s*@claude\s+petitio\b/im.test(strip(c.body || '')));
            if (petitios.length === 0) {
              await reply(['**No petitio yet.** Post the petitio first (Intent, Approach, Completion check); then the nod has something to accept.']);
              return;
            }
            const holder = petitios[petitios.length - 1];

            const { owner, repo } = context.repo;
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: ['in-progress'],
            });
            for (const name of ['open', 'paused']) {
              if (!labels.includes(name)) continue;
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: issue.number, name,
                });
              } catch (e) {
                core.warning(`could not remove ${name}: ${e.message}`);
              }
            }

            await reply([
              `**Accepted.** The petitio at ${holder.html_url} holds this seat now: label \`in-progress\`.`,
              '',
              'Build on a branch, open a PR, and the usual seal path applies.',
            ]);
            core.info(`placet accepted petitio ${holder.id}`);

