# Custos — Stamp on Submit
#
# When the owner submits a comment, a review, or a review comment, this adds one line to the end of it:
#   prima-clock: YYYYMMDDHHMM UTC (stamped on submit)
# The time is the one GitHub recorded for the submit, in UTC. The owner's hand-typed stamps stay as they are.
#
# Requested by the Shepherd on PR 471 (2026-10-31): option 1, append a line.
# Owner only, never a bot, never a body with the Claude Code footer, never twice.
# The rules are in .github/scripts/stamp-on-submit.js and are tested offline by tools/test_stamp_on_submit.js.
# This workflow stamps. It never labels, seals or merges.
#
# Note: issue_comment events run the workflow file from the default branch, so ordinary PR and issue comments
# are stamped only once this file is on main. Review comments and reviews run from the PR's own copy.
name: Custos — Stamp on Submit

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: stamp-on-submit-${{ github.event.comment.id || github.event.review.id }}
  cancel-in-progress: false

jobs:
  stamp:
    if: >-
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.type != 'Bot' &&
       github.event.review.author_association == 'OWNER') ||
      (github.event_name != 'pull_request_review' &&
       github.event.comment.user.type != 'Bot' &&
       github.event.comment.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Add the stamp line
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const lib = require('./.github/scripts/stamp-on-submit.js');
            await lib.apply({ github, context, core });
