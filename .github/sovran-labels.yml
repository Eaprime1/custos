# Sovran BBS — Label Schema
#
# Canonical label definitions for the custos Sovran system.
# Applied by: .github/workflows/sovran-labels-sync.yml
# Usage: comment `@claude sync-labels` on any issue or PR,
#        or trigger manually from the Actions tab.
#
# Colors follow GitHub label convention (hex without #).
# The `held` and `witnessed` labels may be shared across repos
# to form a system-wide tracking layer.

labels:
  # ── Concordance ────────────────────────────────────────────────────────────
  - name: concordance
    color: "0075ca"
    description: "PR has a compiled concordance report"

  # ── Artifact signals ───────────────────────────────────────────────────────
  - name: icon-assigned
    color: "e4e669"
    description: "PR introduces or assigns a project icon"

  - name: glossary-update
    color: "d93f0b"
    description: "PR updates the glossary, dictionary, or lexeme registry"

  # ── BBS / Sovran status ────────────────────────────────────────────────────
  - name: bbs-active
    color: "0052cc"
    description: "BBS node is active — PR is in live dialogue"

  - name: sovran
    color: "5319e7"
    description: "Sovran system contribution"

  # ── Custody states ─────────────────────────────────────────────────────────
  - name: held
    color: "b60205"
    description: "Held — addressed in a separate conversation or decision"

  - name: witnessed
    color: "0e8a16"
    description: "Witnessed and recorded in the prima custody chain"

  # ── Branch lifecycle ───────────────────────────────────────────────────────
  - name: closure
    color: "bfd4f2"
    description: "Stale branch closure — follows docs/stale-branch-closure.md"

  # ── Finalization (mirrors finalize-pr.yml) ─────────────────────────────────
  - name: finalized
    color: "5319e7"
    description: "Review period closed — PR Journey committed"

  # ── Issue system (docs/issue-system.md) ───────────────────────────────────
  # Type — exactly one per issue
  - name: mission
    color: "1d76db"
    description: "Structured work: clear deliverable + deterministic completion check"

  - name: bounty
    color: "fbca04"
    description: "Open challenge: problem defined, approach open. Pays XP + credit, not cash"

  - name: upgrade
    color: "3358ce"
    description: "Sharpen or extend something that already exists"

  - name: lexeme
    color: "c5def5"
    description: "Develop a named concept or term from a citable source (the fallback path)"

  # State — one at a time, moves left to right
  - name: open
    color: "0e8a16"
    description: "Available — no claim yet"

  - name: claimed
    color: "fef2c0"
    description: "Someone commented a claim; work in progress"

  - name: submitted
    color: "bfdadc"
    description: "A PR or submission is linked and waiting on the Shepherd"

  - name: needs-shepherd
    color: "e99695"
    description: "Blocked on a Shepherd decision, device access, or an outside system"

  # Modifiers
  - name: bot-friendly
    color: "5319e7"
    description: "Carries a Bot Brief; automated submissions welcome"

  - name: anchor-review
    color: "d93f0b"
    description: "[ANCHOR REVIEW NEEDED] — a lore or custody claim lacks an anchor (guides/anchor-review.md)"

# ∰🌿-sovran_labels_v1
