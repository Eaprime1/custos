documentation:
  - changed-files:
      - any-glob-to-any-file: ['*.md', 'docs/**', 'guides/**']

automation:
  - changed-files:
      - any-glob-to-any-file: ['.github/workflows/**', '.github/actions/**', '.github/labeler.yml']

tooling:
  - changed-files:
      - any-glob-to-any-file: ['tools/**', 'seeds/**']
