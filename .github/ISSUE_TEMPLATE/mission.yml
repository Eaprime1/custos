name: Mission
description: A structured task with a clear deliverable and completion check. Any contributor may claim it.
title: "[mission] "
labels: ["mission", "open"]
body:
  - type: markdown
    attributes:
      value: |
        **A mission is structured work.** It has a clear objective, defined deliverables, and a deterministic completion check. Any contributor — human or AI — may claim it by commenting `claiming this` and opening a PR.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One sentence. What must be accomplished?
      placeholder: "Build X so that Y."
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Deliverables
      description: What files, outputs, or artifacts will exist when this is done?
      placeholder: |
        - `path/to/file.md` created with content matching the spec
        - `tools/new-tool.sh` runs without error
    validations:
      required: true

  - type: textarea
    id: read_first
    attributes:
      label: Read first
      description: "Bot Brief 1 — exact paths a contributor (or bot) must read. Always include prima.yaml and CLAUDE.md."
      value: |
        - `prima.yaml`
        - `CLAUDE.md`
        - `docs/issue-system.md`
    validations:
      required: true

  - type: textarea
    id: write_to
    attributes:
      label: Write to
      description: "Bot Brief 2 & 3 — exact output path(s) and form. Say world/ vs atelier/ vs tools/ explicitly; say 'no Python, no new runtime' when that applies."
      placeholder: "`atelier/<slug>.md` — Markdown, lore tone. No Python, no new runtime."
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: "Bot Brief 6 — what a submission must NOT do."
      value: |
        - Don't edit `vault/` or `world/the-the.md`
        - Don't invent history or claim rewards not named here
        - Don't add dependencies or a build step
    validations:
      required: false

  - type: textarea
    id: completion_check
    attributes:
      label: Completion Check
      description: A deterministic bash command that confirms the mission is done.
      render: bash
      placeholder: |
        ls path/to/file.md && echo "mission complete"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Background the contributor needs. Links to relevant files, prior work, or lore.
    validations:
      required: false

  - type: dropdown
    id: faction
    attributes:
      label: Best suited faction
      description: Which faction's skills fit this mission?
      options:
        - Scribes (writing, analysis, documentation)
        - Builders (code, scripts, tools)
        - Sentinels (review, validation, security)
        - Wanderers (any — open to all)
    validations:
      required: true

  - type: input
    id: required_access
    attributes:
      label: Required access
      description: "Badges a contributor needs to execute this effectively. Leave blank if none. List badge tokens — e.g. `notebook:radix`, `drive:breathe-ii`."
      placeholder: "notebook:radix, drive:breathe-ii"
    validations:
      required: false

  - type: input
    id: xp
    attributes:
      label: XP reward
      description: Experience points on successful completion (10–500 typical)
      placeholder: "100"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        **If this can't be done as written:** take the lexeme path. Pick one term or concept named above, research it (Wikipedia preferred; any citable source), and file a note in `atelier/lexemes/`. See `docs/issue-system.md` §6.

        **Before you submit:** answer the Sense Check in the PR template. Does what you made answer this issue, and would it make sense to a stranger?
