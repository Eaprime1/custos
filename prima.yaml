# prima.yaml — Concept Manifest
# Fill this in when you fork the template.
# Run: bash tools/scan_lexeme.sh to find unfilled placeholders.

concept:
  name: "custos"                   # display name of this concept
  slug: "custos"                   # url-safe identifier, no spaces
  version: "0.1.0"
  tagline: "Guardian of the work you do from here."
  theme: "guardian"                # shepherd, keeper, watchman of the Podium

author:
  handle: "eaprime1"
  contact: "eaprime@gmail.com"

runtime:
  platform: "termux"               # termux | linux | macos | any
  min_android_api: 24              # Termux only — omit for other platforms
  required_packages: []
  optional_packages: []

unexusi:
  profile_version: "1.0"
  spec: "unexusi/connect.yaml"

quests:
  start: "quests/000-thee-the-door.md"   # first quest — name the concept
  format_spec: "quests/QUEST_SCHEMA.md"

world:
  lore: "world/lore.md"
  factions: "world/factions.md"

seeds:
  bootstrap: "seeds/bootstrap.sh"
  packages: "seeds/packages.yaml"

intake:
  door: "intake/README.md"
  incoming: "intake/incoming.md"
  triad: "intake/triad-thee-yod-ember.md"

queue:
  weir: "queue/artesium-weir/README.md"
  carrier_template: "templates/carrier.md"

seep_artois:
  index: "seep-artois/README.md"

turns:
  schema: "turns/TURN_SCHEMA.md"
  log: "turns/log.md"

prime:
  state: ".prime"
  check: "tools/prime_check.sh"

tools:
  thee: "tools/thee.sh"
  yod: "tools/yod.sh"
  ember: "tools/ember.sh"
  prime_check: "tools/prime_check.sh"
  scan_lexeme: "tools/scan_lexeme.sh"
  ethics_check: "tools/ethics_check.md"
  valuation_report: "tools/valuation_report.sh"

valuation:
  system: "valuation/README.md"
  lore: "world/five-lakes.md"
  ledger: "valuation/ledger_raw.csv"
  crawl_summary: "valuation/crawl_summary.md"
  artesian_scan: "tools/artesian_scan.sh"
